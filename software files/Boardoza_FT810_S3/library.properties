sentence=Boardoza FT810 library adapted for the ESP32-S3 custom SPI pins.
paragraph=This library provides an easy‑to‑use API for interfacing with the Boardoza FT810 embedded video engine (EVE) breakout. It handles SPI communication and simplifies rendering of advanced graphics, touch input, audio output, and display list management. With built‑in command wrappers, error handling, and clear example sketches, the library enables fast and efficient integration of the FT810 into Arduino or PlatformIO projects with TFT displays.
